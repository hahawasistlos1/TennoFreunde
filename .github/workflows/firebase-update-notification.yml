name: Firebase update notification

on:
  release:
    types: [published]
  push:
    branches: [master]
    paths: [.github/workflows/firebase-update-notification.yml]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Nur Verbindung und Nachricht prüfen (keine Zustellung)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-update-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  notify-testers:
    if: github.event_name != 'release' || (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check published release and APK
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          EVENT_NAME: ${{ github.event_name }}
          VALIDATE_INPUT: ${{ inputs.validate_only }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/$REPOSITORY/releases/latest"
          if [[ "$EVENT_NAME" == "release" ]]; then
            endpoint="https://api.github.com/repos/$REPOSITORY/releases/$RELEASE_ID"
          fi
          release="$(curl --fail-with-body --silent --show-error --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$endpoint")"
          if ! jq -e '.draft == false and .prerelease == false and any(.assets[]; (.name | ascii_downcase | endswith(".apk")) and .size > 0)' <<< "$release" >/dev/null; then
            echo "::error::No published stable release with an uploaded APK found."
            exit 1
          fi
          tag="$(jq -r '.tag_name' <<< "$release")"
          if [[ ! "$tag" =~ ^v?[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Invalid release version."
            exit 1
          fi
          url="$(jq -r '.html_url' <<< "$release")"
          validate=true
          if [[ "$EVENT_NAME" == "release" || ( "$EVENT_NAME" == "workflow_dispatch" && "$VALIDATE_INPUT" == "false" ) ]]; then
            validate=false
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "validate=$validate" >> "$GITHUB_OUTPUT"

      - name: Authenticate with Firebase through Workload Identity
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/661219300340/locations/global/workloadIdentityPools/github-tennofreunde/providers/github-actions
          service_account: tennofreunde-update-push@tennofreunde.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          create_credentials_file: false

      - name: Validate or send Firebase update notification
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          VALIDATE_ONLY: ${{ steps.release.outputs.validate }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg version "$RELEASE_VERSION" --arg url "$RELEASE_URL" --argjson validate "$VALIDATE_ONLY" \
            '{validate_only:$validate,message:{topic:"app_updates",data:{version:$version,url:$url,title:("TennoFreunde "+$version),body:"Eine neue App-Version ist auf GitHub verfügbar."},android:{priority:"high"}}}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json; UTF-8" \
            --data "$payload" "https://fcm.googleapis.com/v1/projects/tennofreunde/messages:send"
          if [[ "$VALIDATE_ONLY" == "true" ]]; then
            echo "Firebase validation passed. No notification delivered." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Update notification for $RELEASE_VERSION sent to app_updates." >> "$GITHUB_STEP_SUMMARY"
          fi
